# G1000 softkey OCR daemon -- copy to config.toml and edit.
# Run with:  python -m g1000_softkey.main -c config.toml run

[app]
# Capture/OCR rate. 4 Hz is plenty: softkeys change only when you press one,
# and with change gating on, unchanged cells cost nothing.
# 12 Hz keeps the worst-case detection delay under ~85 ms. Change gating makes
# an unchanged cycle cost a fraction of a millisecond, so a high rate is nearly
# free; the OCR only runs on cells whose pixels actually moved.
loop_hz = 12.0
# Skip OCR for cells whose pixels did not change since the previous frame.
change_gating = true
# Per-pixel intensity difference that counts as a change (0..255).
change_tolerance = 6

# --- displays --------------------------------------------------------------
# One section per captured window. `key` is the table name and also the
# dataref prefix: g1000/softkey/<key>/1..12
#
# window_title is a case-insensitive SUBSTRING of the pop-out window title.
# Run `python -m g1000_softkey.main list-windows` on the X-Plane machine to
# see the real titles, then paste a distinctive part of them here.
#
# geometry is expressed as FRACTIONS of the window's client area so it
# survives a resize. Get a starting point from:
#   python -m g1000_softkey.main -c config.toml calibrate
# then check calibration/<key>_overlay.png and nudge the numbers.

[display.pfd]
window_title = "G1000 PFD"
enabled = true
# dataref_prefix = "g1000/softkey/pfd"   # defaults to g1000/softkey/<key>

[display.pfd.geometry]
x = 0.050      # left edge of the softkey strip
y = 0.915      # top edge
w = 0.900      # width
h = 0.055      # height
cells = 12
cell_pad_x = 0.10   # fraction of a cell trimmed off each side
cell_pad_y = 0.12   # fraction of the strip height trimmed top and bottom

[display.mfd]
window_title = "G1000 MFD"
enabled = true

[display.mfd.geometry]
x = 0.050
y = 0.915
w = 0.900
h = 0.055
cells = 12
cell_pad_x = 0.10
cell_pad_y = 0.12

# --- OCR -------------------------------------------------------------------
[ocr]
engine = "auto"          # auto | tesserocr | pytesseract  (auto prefers tesserocr)
lang = "eng"
psm = 7                  # single text line
whitelist = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 -/"
# The glyphs are only ~10 px tall in the capture and arrive slightly soft.
# Thresholding them at that size closes the counters of 0, 6, 8 and 9, and a
# filled counter is not a character at all -- Tesseract returns an empty string
# rather than a wrong digit. An unsharp mask before thresholding keeps the holes
# open: measured on cells at the captured scale, digit accuracy went from 43/64
# to 58/64 with no loss on multi-character labels. Set sharpen_amount = 0 to
# disable. If short labels still read empty, the strip needs more pixels.
upscale = 4.0
sharpen_amount = 1.2
sharpen_radius = 1.4
threshold = "otsu"       # otsu | adaptive -- per cell, never global
fuzzy_cutoff = 0.62      # difflib cutoff for snapping to labels.txt
blank_ink_ratio = 0.004  # below this fraction of "ink" a cell is reported as ""
# How far a pixel must sit from the cell's dominant tone to count as ink. The
# G1000 dims unavailable softkeys rather than hiding them, so too high a value
# turns a dim-but-present label into an empty cell. Short labels break first --
# a lone digit carries much less evidence than a word, so a missing "0" on the
# XPDR code screen while longer labels still read is the signature. Lower it to
# ~20 if dim labels are being dropped.
blank_contrast = 40
# labels_file = "g1000_softkey/labels.txt"   # relative paths resolve next to this file
# tessdata_path = "C:/Program Files/Tesseract-OCR/tessdata"

# --- publishing ------------------------------------------------------------
[publish]
target = "websocket"        # websocket | webapi | file | console
base_url = "http://localhost:8086"
api_version = "v1"       # v1 works on X-Plane 12.1.1+; v2 from 12.1.4
field_width = 16         # bytes per dataref -> PilotsDeck address ':s16'
timeout = 1.0
retry_interval = 5.0     # seconds between reconnect attempts
# json_path = "C:/Users/you/AppData/Local/Temp/g1000_softkey_labels.json"
# (empty -> <system temp>/g1000_softkey_labels.json, the same default the
#  XPPython3 plugin uses; override both sides with the G1000_SOFTKEY_JSON
#  environment variable)
